# SPDX-License-Identifier: AGPL-3.0-or-later
name: release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g., v0.1.0). Used to check out the release commit."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Display + slug constants used by every step that names a binary,
  # bundle, AppDir entry, or icon. Bumped here once and the rest of
  # the workflow follows.
  BIN_NAME: yryvu-app
  APP_DISPLAY_NAME: Yryvu
  APP_DESCRIPTION: Cross-platform Git client built with Rust + Tauri 2 + SolidJS
  DESKTOP_ID: yryvu

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux job emits the .deb via Tauri's bundler. The .AppImage
          # is built in the dedicated `appimage` job below using the
          # raw release binary, because Tauri's AppImage bundler
          # produces a minimal AppImage that crashes on distros where
          # WebKit2GTK helpers live outside /usr/libexec/webkit2gtk-4.1
          # (EGL_BAD_PARAMETER on Bazzite F43, repro'd in #274).
          - target: linux-amd64
            os: ubuntu-latest
            bundles: deb
            artifact_glob: target/release/bundle/deb/*.deb
          - target: windows-amd64
            os: windows-latest
            bundles: msi
            artifact_glob: target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-${{ matrix.target }}

      - name: Install Linux dev dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: apps/yryvu-app
        run: bun install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # OAuth credentials are injected via GitHub Repo Secrets and read
      # by `crates/yryvu-bridge/build.rs`, which forwards them to the
      # library via `cargo:rustc-env=`. When the secrets are unset
      # (e.g. forks running this workflow), `option_env!()` returns
      # `None` and the OAuth flow short-circuits — the build still
      # succeeds, the OAuth panel just shows `Not configured`.
      - name: Build Tauri bundles
        working-directory: apps/yryvu-app
        env:
          CHAJA_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.CHAJA_GITHUB_OAUTH_CLIENT_ID }}
          CHAJA_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.CHAJA_GITHUB_OAUTH_CLIENT_SECRET }}
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

      # The Linux job also uploads the raw release binary so the
      # AppImage job can grab it without rebuilding.
      - name: Upload raw Linux binary
        if: matrix.target == 'linux-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/${{ env.BIN_NAME }}
          if-no-files-found: error

  appimage:
    name: AppImage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: artifacts/binary

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgdk-pixbuf2.0-bin \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl libgstreamer1.0-dev

      - name: Download tools
        run: |
          curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x appimagetool linuxdeploy

      - name: Prepare AppDir
        run: |
          mkdir -p yryvu.AppDir/usr/bin
          cp "artifacts/binary/${BIN_NAME}" "yryvu.AppDir/usr/bin/${BIN_NAME}"
          chmod +x "yryvu.AppDir/usr/bin/${BIN_NAME}"

          # Tauri stores icons under apps/yryvu-app/src-tauri/icons/.
          # Use the 256-px PNG to preserve resolution; appimagetool
          # rescales to the embedded thumbnail size automatically.
          ICON_SRC="apps/yryvu-app/src-tauri/icons/128x128@2x.png"
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC="apps/yryvu-app/src-tauri/icons/icon.png"
          fi
          cp "$ICON_SRC" "yryvu.AppDir/${DESKTOP_ID}.png"

          cat > "yryvu.AppDir/${DESKTOP_ID}.desktop" << DESKTOP_EOF
          [Desktop Entry]
          Name=${APP_DISPLAY_NAME}
          Comment=${APP_DESCRIPTION}
          Exec=${BIN_NAME}
          Icon=${DESKTOP_ID}
          Type=Application
          Categories=Development;RevisionControl;
          Terminal=false
          DESKTOP_EOF

      - name: Bundle libraries
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Bundle direct .so deps with linuxdeploy.
          ./linuxdeploy --appdir yryvu.AppDir \
            --executable "yryvu.AppDir/usr/bin/${BIN_NAME}" \
            --desktop-file "yryvu.AppDir/${DESKTOP_ID}.desktop" \
            --icon-file "yryvu.AppDir/${DESKTOP_ID}.png"

          # WebKit2GTK helpers (WebKitWebProcess, WebKitNetworkProcess,
          # injected-bundle) are dlopen'd from a path hardcoded inside
          # libwebkit2gtk-4.1.so at build time. Patch the .so to use a
          # relative `././` prefix instead of `/usr/...` so it picks up
          # the bundled helpers regardless of where the host distro
          # placed its system WebKit. This is the fix for the
          # `EGL_BAD_PARAMETER` crash on Bazzite F43 (#274).
          WEBKIT_DIR=""
          for candidate in /usr/libexec/webkit2gtk-4.1 /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1; do
            if [ -d "$candidate" ]; then
              WEBKIT_DIR="$candidate"
              break
            fi
          done
          if [ -z "$WEBKIT_DIR" ]; then
            WKP=$(find /usr -name "WebKitWebProcess" -path "*webkit2gtk*" 2>/dev/null | head -1)
            if [ -n "$WKP" ]; then
              WEBKIT_DIR=$(dirname "$WKP")
            fi
          fi

          WEBKIT_HARDCODED=$(strings "yryvu.AppDir/usr/lib/libwebkit2gtk-4.1.so.0" 2>/dev/null | grep -m1 '/webkit2gtk-4.1$')
          if [ -n "$WEBKIT_DIR" ] && [ -n "$WEBKIT_HARDCODED" ]; then
            WEBKIT_RELATIVE="././${WEBKIT_HARDCODED#/usr}"
            echo "Patching WebKit path: $WEBKIT_HARDCODED -> $WEBKIT_RELATIVE"
            LC_ALL=C sed -i "s|$WEBKIT_HARDCODED|$WEBKIT_RELATIVE|g" "yryvu.AppDir/usr/lib/libwebkit2gtk-4.1.so.0"
            HELPERS_DEST="yryvu.AppDir${WEBKIT_HARDCODED#/usr}"
            mkdir -p "$HELPERS_DEST"
            cp "$WEBKIT_DIR/WebKitWebProcess" "$HELPERS_DEST/"
            cp "$WEBKIT_DIR/WebKitNetworkProcess" "$HELPERS_DEST/"
            if [ -d "$WEBKIT_DIR/injected-bundle" ]; then
              cp -r "$WEBKIT_DIR/injected-bundle" "$HELPERS_DEST/"
            fi
          else
            echo "::warning::WebKit helpers or library not found"
          fi

          # GLib compiled schemas (settings backend yryvu leans on
          # transitively via tauri-plugin-dialog).
          if [ -f "/usr/share/glib-2.0/schemas/gschemas.compiled" ]; then
            mkdir -p yryvu.AppDir/usr/share/glib-2.0/schemas
            cp /usr/share/glib-2.0/schemas/gschemas.compiled yryvu.AppDir/usr/share/glib-2.0/schemas/
          fi

          # GIO modules (TLS support) — required for HTTPS in
          # webkit-network-process.
          GIO_DIR=$(pkg-config --variable=giomoduledir gio-2.0 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/gio/modules")
          if [ -d "$GIO_DIR" ]; then
            mkdir -p yryvu.AppDir/usr/lib/gio/modules
            cp "$GIO_DIR"/*.so yryvu.AppDir/usr/lib/gio/modules/
          fi

          # GDK pixbuf loaders (image format decoders).
          PIXBUF_DIR="/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0"
          if compgen -G "$PIXBUF_DIR/loaders/*.so" > /dev/null 2>&1; then
            mkdir -p yryvu.AppDir/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders
            cp "$PIXBUF_DIR/loaders"/*.so yryvu.AppDir/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders/
            if command -v gdk-pixbuf-query-loaders &>/dev/null; then
              GDK_PIXBUF_MODULEDIR="yryvu.AppDir/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders" \
                gdk-pixbuf-query-loaders > "yryvu.AppDir/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
            fi
          fi

      - name: Bundle GStreamer plugins
        run: |
          # GStreamer plugins are loaded via dlopen() — invisible to
          # ldd. Required for media playback inside any WebKit content
          # we render (avatars, README image previews, etc.).
          GST_PLUGIN_DIR=$(pkg-config --variable=pluginsdir gstreamer-1.0 2>/dev/null)
          if [ -z "$GST_PLUGIN_DIR" ] || [ ! -d "$GST_PLUGIN_DIR" ]; then
            for candidate in /usr/lib/x86_64-linux-gnu/gstreamer-1.0 /usr/lib64/gstreamer-1.0; do
              if [ -d "$candidate" ]; then
                GST_PLUGIN_DIR="$candidate"
                break
              fi
            done
          fi
          if [ -n "$GST_PLUGIN_DIR" ] && [ -d "$GST_PLUGIN_DIR" ]; then
            GST_PLUGINS=(
              coreelements typefindfunctions app playback matroska vpx
              opus vorbis ogg audioconvert audioresample videoconvertscale
              autodetect volume opengl gio
            )
            mkdir -p yryvu.AppDir/usr/lib/gstreamer-1.0
            for plugin in "${GST_PLUGINS[@]}"; do
              FOUND=$(compgen -G "$GST_PLUGIN_DIR/libgst${plugin}.*" 2>/dev/null | head -1)
              if [ -n "$FOUND" ]; then
                cp "$FOUND" yryvu.AppDir/usr/lib/gstreamer-1.0/
              else
                echo "::warning::GStreamer plugin not found: $plugin"
              fi
            done

            # Plugin scanner — path varies by distro.
            GST_SCANNER=""
            GST_SCANNER_DIR=$(pkg-config --variable=pluginscannerdir gstreamer-1.0 2>/dev/null)
            if [ -n "$GST_SCANNER_DIR" ] && [ -x "$GST_SCANNER_DIR/gst-plugin-scanner" ]; then
              GST_SCANNER="$GST_SCANNER_DIR/gst-plugin-scanner"
            elif [ -x "/usr/libexec/gstreamer-1.0/gst-plugin-scanner" ]; then
              GST_SCANNER="/usr/libexec/gstreamer-1.0/gst-plugin-scanner"
            else
              GST_SCANNER=$(find /usr -name "gst-plugin-scanner" -path "*/gstreamer-1.0/*" 2>/dev/null | head -1)
            fi
            if [ -n "$GST_SCANNER" ]; then
              mkdir -p yryvu.AppDir/usr/libexec/gstreamer-1.0
              cp "$GST_SCANNER" yryvu.AppDir/usr/libexec/gstreamer-1.0/
            else
              echo "::warning::GStreamer plugin scanner not found"
            fi
          else
            echo "::warning::GStreamer plugin directory not found, skipping"
          fi

      - name: Generate AppRun
        run: |
          # linuxdeploy left an AppRun symlink to the binary in place;
          # remove it so we can write our own wrapper without losing
          # the binary.
          rm -f yryvu.AppDir/AppRun
          cat > yryvu.AppDir/AppRun << APPRUN_EOF
          #!/bin/bash
          SELF=\$(readlink -f "\$0")
          HERE=\${SELF%/*}

          # Bundled library + module paths
          export LD_LIBRARY_PATH="\${HERE}/usr/lib:\${LD_LIBRARY_PATH}"
          export GIO_MODULE_DIR="\${HERE}/usr/lib/gio/modules"
          export GDK_PIXBUF_MODULE_FILE="\${HERE}/usr/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          export GSETTINGS_SCHEMA_DIR="\${HERE}/usr/share/glib-2.0/schemas"

          # GStreamer plugin paths
          export GST_PLUGIN_PATH="\${HERE}/usr/lib/gstreamer-1.0"
          export GST_PLUGIN_SYSTEM_PATH=""
          export GST_PLUGIN_SCANNER="\${HERE}/usr/libexec/gstreamer-1.0/gst-plugin-scanner"
          export GST_REGISTRY="\${HOME}/.cache/${DESKTOP_ID}/gst-registry-${BIN_NAME}.bin"

          # The patched libwebkit2gtk-4.1.so resolves WebKit helpers
          # via \`././libexec/webkit2gtk-4.1/\` — relative to whatever
          # cwd the binary is launched in. cd to the AppDir root so
          # those paths resolve correctly.
          cd "\${HERE}"

          export PATH="\${HERE}/usr/bin:\${PATH}"
          exec "\${HERE}/usr/bin/${BIN_NAME}" "\$@"
          APPRUN_EOF
          chmod +x yryvu.AppDir/AppRun

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Read the version straight from the manifest. Stops a stale
          # constant in this workflow drifting from the truth.
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          OUTPUT="Yryvu_${VERSION}_amd64.AppImage"
          ARCH=x86_64 ./appimagetool yryvu.AppDir "$OUTPUT"
          ls -la "$OUTPUT"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: bundles-appimage
          path: Yryvu_*_amd64.AppImage
          if-no-files-found: error

  upload-assets:
    name: upload assets
    needs: [build, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Skip the raw linux-binary artifact — it's an internal
          # hand-off between build → appimage and shouldn't ship.
          pattern: bundles-*

      - name: Flatten artifact tree
        working-directory: artifacts
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -la

      - name: Compute checksums
        working-directory: artifacts
        run: |
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          append_body: true
          body: |

            ## Downloads

            | File | Description |
            |------|-------------|
            | `*.deb` | Debian / Ubuntu (`sudo apt install ./yryvu-app_*.deb`). NOTE: Fedora atomic distros (Bazzite, Silverblue) cannot install this — use the AppImage. |
            | `Yryvu_*_amd64.AppImage` | Portable Linux binary with bundled WebKit/GStreamer/pixbuf — works across distros without manual env-var overrides (`chmod +x` then run). |
            | `*.msi` | Windows installer (unsigned — SmartScreen will warn). |
            | `checksums-sha256.txt` | SHA-256 checksums for all files. |

            > **Note:** unsigned alpha builds. Windows SmartScreen and macOS Gatekeeper will warn — this is normal until code signing lands. See [SECURITY.md](https://github.com/lobinuxsoft/yryvu/blob/main/SECURITY.md) for the disclosure path if you suspect a tampered binary.
          files: artifacts/*
          generate_release_notes: false
