# SPDX-License-Identifier: AGPL-3.0-or-later
name: release

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g., v0.1.0). Used to check out the release commit."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            bundles: deb,appimage
            artifact_glob: |
              apps/chaja-app/src-tauri/target/release/bundle/deb/*.deb
              apps/chaja-app/src-tauri/target/release/bundle/appimage/*.AppImage
          - target: windows-amd64
            os: windows-latest
            bundles: msi
            artifact_glob: |
              apps/chaja-app/src-tauri/target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release-${{ matrix.target }}

      - name: Install Linux dev dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        working-directory: apps/chaja-app
        run: bun install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # OAuth credentials are injected via GitHub Repo Secrets and read
      # by `crates/chaja-bridge/build.rs`, which forwards them to the
      # library via `cargo:rustc-env=`. When the secrets are unset
      # (e.g. forks running this workflow), `option_env!()` returns
      # `None` and the OAuth flow short-circuits — the build still
      # succeeds, the OAuth panel just shows `Not configured`.
      - name: Build Tauri bundles
        working-directory: apps/chaja-app
        env:
          CHAJA_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.CHAJA_GITHUB_OAUTH_CLIENT_ID }}
          CHAJA_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.CHAJA_GITHUB_OAUTH_CLIENT_SECRET }}
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  upload-assets:
    name: upload assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        working-directory: artifacts
        run: |
          ls -la
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          append_body: true
          body: |

            ## Downloads

            | File | Description |
            |------|-------------|
            | `*.deb` | Debian / Ubuntu / Bazzite (`sudo apt install ./chaja-app_*.deb`) |
            | `*.AppImage` | Portable Linux binary (`chmod +x` then run) |
            | `*.msi` | Windows installer (unsigned — SmartScreen will warn) |
            | `checksums-sha256.txt` | SHA-256 checksums for all files |

            > **Note:** unsigned alpha builds. Windows SmartScreen and macOS Gatekeeper will warn — this is normal until code signing lands. See [SECURITY.md](https://github.com/lobinuxsoft/chaja/blob/main/SECURITY.md) for the disclosure path if you suspect a tampered binary.
          files: artifacts/*
          generate_release_notes: false
